<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/src/style.css" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-tailwind-js-template</title>
  </head>
  <body>
    <h1 class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-center">Pokemon Browser</h1>
    <main class="flex flex-col min-h-screen items-center justify-end-safe">
      <figure id="Image Pokemon" class="hidden">Image of Pokemon</figure>
      <div>
        <ul id="image from API"></ul>
      </div>
      <button id="Previous" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Previous
        <nav class="flex- justify-between items-center" aria-label="Navigation between buttons"></nav>
      </button>
      <button id="Next" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded"> Next </button>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
